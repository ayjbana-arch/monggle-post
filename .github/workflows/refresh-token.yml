name: 인스타 토큰 갱신

on:
  schedule:
    # 매주 월요일. 토큰은 60일짜리라 여유 있게 갱신한다.
    - cron: "23 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 토큰 갱신 후 Secrets 에 저장
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          resp=$(curl -sS --fail-with-body -G "https://graph.instagram.com/refresh_access_token" \
            --data-urlencode "grant_type=ig_refresh_token" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN") || { echo "갱신 실패"; exit 1; }
          new=$(printf '%s' "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          echo "::add-mask::$new"
          printf '%s' "$new" | gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
          echo "갱신 완료"
